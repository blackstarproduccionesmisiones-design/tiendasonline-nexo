<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXO+ Tiendas Online</title>
    <meta
      name="description"
      content="Plataforma multicomercio de catálogos online conectada a WhatsApp, con panel maestro de administración, gestión de tiendas e instalación PWA personalizada."
    />
    <meta property="og:title" content="NEXO+ Tiendas Online" />
    <meta
      property="og:description"
      content="Plataforma multicomercio de catálogos online conectada a WhatsApp, con panel maestro de administración, gestión de tiendas e instalación PWA personalizada."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NEXO+" id="meta-apple-title" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" id="link-apple-icon" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" id="link-favicon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAFAFA] text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">
    <script>
      (function () {
        try {
          var s = new URLSearchParams(window.location.search).get('store');
          if (s) {
            var slug = encodeURIComponent(s.trim().toLowerCase());
            var l = document.querySelector('link[rel="manifest"]');
            var targetHref = '/api/manifest/' + slug;
            if (l) {
              l.setAttribute('href', targetHref);
            } else {
              var newL = document.createElement('link');
              newL.rel = 'manifest';
              newL.href = targetHref;
              document.head.appendChild(newL);
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
